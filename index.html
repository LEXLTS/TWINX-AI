<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TWINX</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app-container">

    <!-- HEADER -->

    <header class="top-header">

        <div class="header-left">

            <img src="assets/logo.jpg" class="logo" alt="TWINX Logo">

        </div>

        <div class="header-center">

            <h1>TWINX</h1>

            <p id="statusText">🌍 Online</p>

        </div>

        <div class="header-right">

            <button class="menu-btn">☰</button>

        </div>

    </header>


    <!-- CHAT -->

    <main id="chatBox" class="chat-area">

    </main>


    <!-- INPUT -->

    <footer class="bottom-bar">

        <button class="attach-btn" id="fileBtn">
            📎
        </button>

        <button class="image-btn" id="imageBtn">
            🖼️
        </button>

        <input
            id="userInput"
            type="text"
            placeholder="Message TWINX...">

        <button id="sendBtn">
            ➤
        </button>

    </footer>

</div>

<script src="script.js"></script>

</body>

</html>
