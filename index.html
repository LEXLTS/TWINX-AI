<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TWINX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Straight Banner -->
  <header class="top-banner">
    <div class="banner-left"></div>
    <div class="banner-center">
      <h1 class="brand-logo">TWINX</h1>
    </div>
    <div class="banner-right">
      <button class="profile-btn" id="profileBtn" aria-label="User Profile">
        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=User" alt="User Profile Avatar" class="profile-avatar">
      </button>

      <!-- Profile Dropdown & History Drawer -->
      <div class="profile-dropdown" id="profileDropdown">
        <div class="user-info">
          <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=User" alt="User Avatar" class="dropdown-avatar">
          <div>
            <h3>User Profile</h3>
            <p>user@twinx.app</p>
          </div>
        </div>
        
        <hr class="divider">

        <div class="menu-section">
          <div class="menu-item"><span class="icon">❓</span> Help & FAQ</div>
          <div class="menu-item"><span class="icon">💬</span> Send Feedback</div>
          <div class="menu-item"><span class="icon">⚙️</span> Settings</div>
        </div>

        <hr class="divider">

        <div class="history-section">
          <h4>Chat History</h4>
          <div class="history-item">
            <span class="history-title">Support & Resistance Strategy</span>
            <span class="history-date">1 day ago</span>
          </div>
          <div class="history-item">
            <span class="history-title">Pine Script Indicator Setup</span>
            <span class="history-date">3 days ago</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Chat Container -->
  <main class="chat-container">
    <div class="chat-stream" id="chatStream">
      <!-- TWINX Welcome Message -->
      <div class="message-row twinx">
        <div class="avatar twinx-avatar">TWINX</div>
        <div class="bubble twinx-bubble">
          Hello! Welcome to TWINX. How can I assist you today?
        </div>
      </div>

      <!-- User Sample Message -->
      <div class="message-row user">
        <div class="bubble user-bubble">
          Can you help me format this setup for my project?
        </div>
        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=User" alt="User" class="avatar user-avatar">
      </div>
    </div>
  </main>

<!-- =========================
     Bottom Input
========================= -->

<footer class="bottom-bar">

    <button id="fileBtn" class="icon-btn">

        📎

    </button>

    <button id="imageBtn" class="icon-btn">

        🖼️

    </button>

    <input
        id="userInput"
        type="text"
        placeholder="Message TWINX...">

    <button id="sendBtn">

        ➤

    </button>

</footer>

  <script src="script.js"></script>
</body>
</html>
